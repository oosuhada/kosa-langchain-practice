<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LangChain RAG - PDF Embedding</title>
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link href="/static/common/css/ai-utils.css" rel="stylesheet" />
  <script src="/static/common/js/ai-utils.js"></script>
  <script>
    // URL 쿼리스트링으로 문서 타입을 읽어서 기본값 설정
    function initFromQuery() {
      const params = new URLSearchParams(window.location.search);
      const doc = params.get("doc");
      if (doc === "보험") {
        document.getElementById("title").value = "삼성화재자동차보험약관";
        document.getElementById("author").value = "삼성화재";
        document.getElementById("docBadge").textContent = "🚗 삼성화재 자동차보험약관";
        document.getElementById("docBadge").className = "badge bg-warning text-dark mb-2";
      } else {
        document.getElementById("title").value = "대한민국헌법";
        document.getElementById("author").value = "국회";
        document.getElementById("docBadge").textContent = "📄 대한민국헌법";
        document.getElementById("docBadge").className = "badge bg-info mb-2";
      }
    }

    // ##### 문서 패널에서 제출 버튼을 클릭했을 때 실행하는 함수 #####
    async function handleDocument() {
      try {
        // 스피너 보여주기
        ai_utils.setSpinner("spinner", true);

        // 입력 데이터 확인
        const title = document.getElementById("title").value.trim();
        const author = document.getElementById("author").value.trim();
        const attach = document.getElementById("attach").files[0];

        if(!title) {
          alert("제목을 입력해야 합니다.");
          return;
        }
        if(!author) {
          alert("작성자를 입력해야 합니다.");
          return;
        }
        if(!attach) {
          alert("PDF 파일을 선택해야 합니다.");
          return;
        }

        const formData = new FormData();
        formData.append("title", title);
        formData.append("author", author);
        formData.append("attach", attach);

        // AJAX 요청하고 응답받기
        const response = await fetch('/sec08/pdf-embedding', {
          method: "post",
          headers: {
            'Accept': 'text/plain'
          },
          body: formData
        });
        
        // LLM 응답을 보여줄 엘리먼트를 채팅 패널에 추가하기
        // 반환값인 uuid는 LLM 응답 메시지가 들어갈 부모 엘리먼트 ID 임
        const uuid = ai_utils.addAnswerPlaceHolder("chatPanel");

        // 텍스트 답변 출력하기
        ai_utils.printAnswerText(response, uuid, "chatPanel");
      } catch (error) {
        console.log(error)
      } finally {
        // 스피너 숨기기
        ai_utils.setSpinner("spinner", false);
      }
    }
  </script>
</head>

<body onload="initFromQuery()">
  <div class="d-flex flex-column vh-100">
    <div id="headPanel" class="navbar justify-content-between">
      <a href="/static/sec08/index.html" class="navbar-brand ps-2">
        <img src="/static/common/image/langchain_logo.png" width="200" />
      </a>
      <div id="spinner" class="spinner-border text-success d-none me-3" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <div id="documentPanel" class="bg-secondary-subtle">
      <div class="p-2 pb-0">
        <span id="docBadge" class="badge bg-info mb-2">📄 대한민국헌법</span>
      </div>
      <div class="input-group p-2 align-items-center">
        <span class="input-group-text">제목</span>
        <input id="title" type="text" class="form-control" placeholder="예: 대한민국헌법">
        <span class="input-group-text">작성자</span>
        <input id="author" type="text" class="form-control" placeholder="예: 국회">
        <span class="input-group-text">PDF</span>
        <input id="attach" type="file" class="form-control" accept="application/pdf">
        <button type="button" class="btn btn-primary" onclick="handleDocument()">제출</button>
      </div>
    </div>    

    <div id="chatPanel" class="flex-grow-1 container-fluid h-100 my-2" style="overflow-y:auto; overflow-x:hidden;">
    </div>

  </div>
</body>

</html>
